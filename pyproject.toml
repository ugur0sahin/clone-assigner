[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clone-assigner"
version = "0.1.0"
description = "Spatial ProCode clone assignment pipeline for Xenium datasets"
authors = [
    {name = "Ugur Sahin"}
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "scanpy",
    "anndata",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "pyyaml",
]

[project.scripts]
clone-assigner = "clone_assigner.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
